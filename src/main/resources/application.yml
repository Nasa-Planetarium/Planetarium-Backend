spring:
  application:
    name: emberline
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  messages:
    basename: messages
    fallback-to-system-locale: false
    encoding: UTF-8
  web:
    resources:
      add-mappings: false
  mvc:
    problemdetails:
      enabled: false
  flyway:
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: 16
      initialization-fail-timeout: -1
  data:
    redis:
      url: ${EMBERLINE_REDIS_CACHE_URL:redis://localhost:6379}
      repositories:
        enabled: false
  modulith:
    events:
      jdbc:
        schema: platform
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: false
  main:
    banner-mode: off
server:
  port: 8080
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 256KB
    max-swallow-size: 256KB
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false
springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    enabled: false
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json
emberline:
  cors:
    allowed-origins: ${EMBERLINE_CORS_ALLOWED_ORIGINS:}
  errors:
    type-base: https://emberline.example/errors
  release:
    root: ${EMBERLINE_RELEASE_ROOT:}
    poll-interval: 10s
  limits:
    hotspots-days-reference: 92
    hotspots-days-all: 31
    hotspots-limit-max: 10000
    summary-day-days: 366
    summary-month-years: 40
    calendar-years: 40
    polygon-vertices: 5000
    cells-max: 10000
    csv-rows: 100000
  ingest:
    copy-workers: 4
    duckdb-memory-limit: 1GB
    duckdb-threads: 4
  firms:
    wms-base-url: ${FIRMS_WMS_BASE_URL:}
    map-key-file: ${FIRMS_MAP_KEY:}
logging:
  pattern:
    correlation: "[%X{request_id:-}] "
---
spring:
  config:
    activate:
      on-profile: flyway | ingest
  main:
    web-application-type: none
emberline:
  release:
    polling-enabled: false
