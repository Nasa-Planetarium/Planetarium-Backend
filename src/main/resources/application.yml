spring:
  application:
    name: emberline
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  messages:
    basename: messages
    fallback-to-system-locale: false
    encoding: UTF-8
  web:
    resources:
      add-mappings: false
  mvc:
    problemdetails:
      enabled: false
  flyway:
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: 16
      initialization-fail-timeout: -1
  data:
    redis:
      url: ${EMBERLINE_REDIS_CACHE_URL:redis://localhost:6379}
      repositories:
        enabled: false
  modulith:
    events:
      jdbc:
        schema: platform
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true
  main:
    banner-mode: off
server:
  port: 8080
  forward-headers-strategy: none
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 256KB
    max-swallow-size: 256KB
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false
springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    enabled: false
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json
emberline:
  cors:
    allowed-origins: ${EMBERLINE_CORS_ALLOWED_ORIGINS:}
  errors:
    type-base: https://emberline.example/errors
  release:
    root: ${EMBERLINE_RELEASE_ROOT:}
    poll-interval: 10s
  limits:
    hotspots-limit-max: 10000
    summary-day-days: 366
    summary-month-years: 40
    calendar-years: 40
    polygon-vertices: 5000
    cells-max: 10000
    csv-rows: 100000
  ingest:
    copy-workers: 4
    duckdb-memory-limit: 1GB
    duckdb-threads: 4
  harmonized:
    cache:
      enabled: true
      url: ${EMBERLINE_REDIS_CACHE_URL:redis://localhost:6379}
      env: ${EMBERLINE_ENV:dev}
      connect-timeout: 300ms
      command-timeout: 500ms
      retry-after: 5s
    duckdb:
      memory-limit: 512MB
      threads: 2
    cell-set-entries: 256
  firms:
    wms-base-url: ${FIRMS_WMS_BASE_URL:}
    map-key-file: ${FIRMS_MAP_KEY_FILE:}
    timeout: 5s
    cache-ttl: 900s
    budget-capacity: 4500
    budget-period: 10m
    env: ${EMBERLINE_ENV:test}
  events:
    transport: redis
    env: ${EMBERLINE_ENV:test}
    durable-url: ${EMBERLINE_REDIS_DURABLE_URL:redis://localhost:6380}
    reclaim-interval: 30s
    min-idle: 60s
    max-deliveries: 5
  ratelimit:
    trusted-proxies: ${EMBERLINE_TRUSTED_PROXIES:}
    ip:
      capacity: 100
      refill-tokens: 50
      refill-period: 1s
    heavy:
      capacity: 30
      refill-tokens: 30
      refill-period: 1m
    tiles:
      capacity: 240
      refill-tokens: 240
      refill-period: 1m
  hotspots:
    max-area-deg2: 100
    max-days-reference: 92
    max-days-all: 31
logging:
  pattern:
    correlation: "[%X{request_id:-}] "
---
spring:
  config:
    activate:
      on-profile: flyway | ingest
  main:
    web-application-type: none
  modulith:
    events:
      republish-outstanding-events-on-restart: false
emberline:
  release:
    polling-enabled: false
  events:
    consumers-enabled: false
