# EMBERLINE (planetarium-backend) on the host K3s. Owner-applied; the app image tag is replaced at deploy time.
# Secret pl-db (keys: username, password) is created out of band and never printed.
apiVersion: v1
kind: Namespace
metadata: {name: planetarium}
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: planetarium-release}
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: planetarium-static
  hostPath: {path: __HOST_HOME__/planetarium/release, type: Directory}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: release, namespace: planetarium}
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: planetarium-static
  volumeName: planetarium-release
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: planetarium-www}
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: planetarium-static
  hostPath: {path: __HOST_HOME__/planetarium/www, type: Directory}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: www, namespace: planetarium}
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: planetarium-static
  volumeName: planetarium-www
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: pl-postgres, namespace: planetarium}
spec:
  serviceName: pl-postgres
  replicas: 1
  selector: {matchLabels: {app: pl-postgres}}
  template:
    metadata: {labels: {app: pl-postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-trixie
          imagePullPolicy: IfNotPresent
          args: ["-c", "shared_buffers=1GB", "-c", "maintenance_work_mem=1GB", "-c", "max_wal_size=8GB", "-c", "work_mem=64MB"]
          env:
            - {name: POSTGRES_DB, value: emberline}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: pl-db, key: username}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: pl-db, key: password}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d emberline"]}, periodSeconds: 5}
          resources: {requests: {cpu: "500m", memory: 2Gi}, limits: {cpu: "6", memory: 6Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: local-path, resources: {requests: {storage: 40Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: pl-postgres, namespace: planetarium}
spec: {selector: {app: pl-postgres}, ports: [{port: 5432, targetPort: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pl-redis-cache, namespace: planetarium}
spec:
  replicas: 1
  selector: {matchLabels: {app: pl-redis-cache}}
  template:
    metadata: {labels: {app: pl-redis-cache}}
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          args: ["--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
          ports: [{containerPort: 6379}]
          resources: {limits: {memory: 384Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: pl-redis-cache, namespace: planetarium}
spec: {selector: {app: pl-redis-cache}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pl-redis-durable, namespace: planetarium}
spec:
  replicas: 1
  selector: {matchLabels: {app: pl-redis-durable}}
  template:
    metadata: {labels: {app: pl-redis-durable}}
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          args: ["--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--dir", "/data"]
          ports: [{containerPort: 6379}]
          resources: {limits: {memory: 384Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: pl-redis-durable, namespace: planetarium}
spec: {selector: {app: pl-redis-durable}, ports: [{port: 6379}]}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: pl-web-conf, namespace: planetarium}
data:
  # http context (the image's nginx.conf includes conf.d/*.conf). Two listeners:
  #   8080 LAN    — pl-web (ClusterIP), reached by pl-web-forward-<LAN_PORT>.service; static www + /api as before.
  #   8090 tunnel — pl-web-tunnel (ClusterIP only), reached by the cloudflared connector; public GET/HEAD allowlist
  #                 plus the one public POST, /api/v1/forecast.
  # Spring's management port 8081 is proxied by neither listener.
  default.conf: |
    # map "" $emberline_data_version { default "<active data_version>"; } — written by deploy/deploy.sh on activation
    include /etc/nginx/release/data-version.map;

    proxy_cache_path /var/cache/emberline levels=1:2 keys_zone=emberline:16m max_size=800m inactive=60m use_temp_path=off;

    # Tunnel client IP: X-Client-IP (the Worker sets it from CF-Connecting-IP) when it is one IPv4 or IPv6 literal,
    # otherwise the TCP peer.
    map $http_x_client_ip $emberline_tunnel_client {
      "~^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$" $http_x_client_ip;
      "~^(([0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}|([0-9A-Fa-f]{1,4}:){1,7}:|([0-9A-Fa-f]{1,4}:){1,6}:[0-9A-Fa-f]{1,4}|([0-9A-Fa-f]{1,4}:){1,5}(:[0-9A-Fa-f]{1,4}){1,2}|([0-9A-Fa-f]{1,4}:){1,4}(:[0-9A-Fa-f]{1,4}){1,3}|([0-9A-Fa-f]{1,4}:){1,3}(:[0-9A-Fa-f]{1,4}){1,4}|([0-9A-Fa-f]{1,4}:){1,2}(:[0-9A-Fa-f]{1,4}){1,5}|[0-9A-Fa-f]{1,4}:(:[0-9A-Fa-f]{1,4}){1,6}|:((:[0-9A-Fa-f]{1,4}){1,7}|:))$" $http_x_client_ip;
      default $remote_addr;
    }

    # Store only what belongs to the key's release: a response with X-Data-Version (release data) must carry the
    # data_version nginx keys on; a response without it (FIRMS tiles) is stored by its own Cache-Control.
    map "$upstream_http_x_data_version|$emberline_data_version" $emberline_skip_store {
      "~^[|]" 0;
      "~^(?<dv>[^|]+)[|]\k<dv>$" 0;
      default 1;
    }
    # Tunnel methods: GET/HEAD on any path (the locations decide), POST only on exactly /api/v1/forecast (a
    # read-only computation with a JSON body); everything else 405 before the body is read. Exact keys first
    # (nginx checks exact keys before regexes): GET/HEAD /api/v1/forecast are 405 too.
    map "$request_method $uri" $emberline_tunnel_405 {
      "POST /api/v1/forecast" 0;
      "GET /api/v1/forecast" 1;
      "HEAD /api/v1/forecast" 1;
      "~^(GET|HEAD) " 0;
      default 1;
    }
    # No release known to nginx yet → no cache at all.
    map $emberline_data_version $emberline_no_cache {
      none 1;
      default 0;
    }

    server {
      listen 8080;
      server_tokens off;
      root /usr/share/nginx/html/current;
      client_max_body_size 256k;
      set $emberline_client $remote_addr;
      include /etc/nginx/conf.d/emberline-proxy.inc;
      location /api/ { proxy_pass http://pl-app:8080; }
      location /v3/api-docs { proxy_pass http://pl-app:8080; }
      location /swagger-ui { proxy_pass http://pl-app:8080; }
      location / { try_files $uri $uri.html $uri/ /index.html; }
    }

    server {
      listen 8090;
      server_tokens off;
      client_max_body_size 1k;
      set $emberline_client $emberline_tunnel_client;
      include /etc/nginx/conf.d/emberline-proxy.inc;
      if ($emberline_tunnel_405) { return 405; }
      # Public allowlist = the GET operations of contract/openapi.yaml (servers: /api/v1) + POST /forecast.
      location = /api/v1/version { proxy_pass http://pl-app:8080; }
      location = /api/v1/aois { proxy_pass http://pl-app:8080; }
      location ~ "^/api/v1/aois/[A-Za-z0-9_:.+?-]{1,64}$" { proxy_pass http://pl-app:8080; }
      location ~ "^/api/v1/aois/[A-Za-z0-9_:.+?-]{1,64}/(boundary|calendar|summary|occurrence|fwi|fire-regime)$" { proxy_pass http://pl-app:8080; }
      location ~ "^/api/v1/aois/[A-Za-z0-9_:.+?-]{1,64}/months/[0-9]{4}-[0-9]{2}/comparison$" { proxy_pass http://pl-app:8080; }
      location = /api/v1/summaries { proxy_pass http://pl-app:8080; }
      location = /api/v1/hotspots { proxy_pass http://pl-app:8080; }
      location = /api/v1/cells { proxy_pass http://pl-app:8080; }
      location = /api/v1/satellite-status { proxy_pass http://pl-app:8080; }
      location = /api/v1/methods/current { proxy_pass http://pl-app:8080; }
      location ~ "^/api/v1/methods/[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" { proxy_pass http://pl-app:8080; }
      location = /api/v1/firms/wms-tiles { proxy_pass http://pl-app:8080; }
      location = /api/v1/occurrence/grid { proxy_pass http://pl-app:8080; }
      location = /api/v1/occurrence/aois { proxy_pass http://pl-app:8080; }
      location = /api/v1/fire-events { proxy_pass http://pl-app:8080; }
      location ~ "^/api/v1/fire-events/(KR|ARG)_[0-9]{8}_[0-9]{4,6}$" { proxy_pass http://pl-app:8080; }
      location = /api/v1/spread-nowcast { proxy_pass http://pl-app:8080; }
      location = /api/v1/cells/frp { proxy_pass http://pl-app:8080; }
      # body ≤ emberline.limits.forecast-body-bytes (131072 = 128k); POST is never stored (proxy_cache_methods)
      location = /api/v1/forecast { client_max_body_size 128k; proxy_pass http://pl-app:8080; }
      location / { default_type application/problem+json; return 404 '{"title":"Not Found","status":404}'; }
    }
  # Server-level proxy settings of both listeners (not *.conf, so only the include loads it). Locations set only
  # proxy_pass, so these are inherited unchanged.
  emberline-proxy.inc: |
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $emberline_client;
    proxy_set_header X-Client-IP "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Real-IP "";
    proxy_read_timeout 60s;
    proxy_cache emberline;
    proxy_cache_key "$emberline_data_version|$request_uri|$http_accept|$http_accept_language";
    proxy_cache_methods GET HEAD;
    proxy_cache_bypass $emberline_no_cache;
    proxy_no_cache $emberline_no_cache $emberline_skip_store;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 20s;
    proxy_cache_lock_age 20s;
    proxy_cache_use_stale updating error timeout http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_revalidate on;
    add_header X-Cache $upstream_cache_status always;
---
# Bootstrap only: deploy/deploy.sh rewrites this ConfigMap with the active data_version and restarts pl-web.
apiVersion: v1
kind: ConfigMap
metadata: {name: pl-web-release, namespace: planetarium}
data:
  data-version.map: |
    map "" $emberline_data_version { default "none"; }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pl-web, namespace: planetarium}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector: {matchLabels: {app: pl-web}}
  template:
    metadata: {labels: {app: pl-web}}
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports: [{name: lan, containerPort: 8080}, {name: tunnel, containerPort: 8090}]
          readinessProbe: {tcpSocket: {port: 8080}, periodSeconds: 5}
          resources: {limits: {memory: 128Mi}}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: release-map, mountPath: /etc/nginx/release}
            - {name: www, mountPath: /usr/share/nginx/html, readOnly: true}
            - {name: cache, mountPath: /var/cache/emberline}
      volumes:
        - {name: conf, configMap: {name: pl-web-conf}}
        - {name: release-map, configMap: {name: pl-web-release}}
        - {name: www, persistentVolumeClaim: {claimName: www, readOnly: true}}
        - {name: cache, emptyDir: {sizeLimit: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: pl-web, namespace: planetarium}
spec: {selector: {app: pl-web}, ports: [{name: lan, port: 8080, targetPort: 8080}]}
---
# LAN entry: K3s ServiceLB is disabled on the host (a LoadBalancer Service stays <pending>, no svclb pods), so the LAN
# entry stays pl-web-forward-<LAN_PORT>.service (kubectl port-forward <HOST_IP>:<LAN_PORT> -> Service pl-web:8080). No
# LoadBalancer or NodePort Service exists: either would open a node port on every host address (docs/DEVIATIONS.md PUB-LAN).
---
# Tunnel listener: ClusterIP only, never NodePort/LoadBalancer. Target of the Workers VPC Service:
# pl-web-tunnel.planetarium.svc.cluster.local:8090
apiVersion: v1
kind: Service
metadata: {name: pl-web-tunnel, namespace: planetarium}
spec:
  type: ClusterIP
  selector: {app: pl-web}
  ports: [{name: tunnel, port: 8090, targetPort: 8090}]
---
# Pod traffic reaches 8090 only from the cloudflared connector; 8080 stays open (LAN). K3s host-network processes
# bypass NetworkPolicy (docs/DEVIATIONS.md PUB-IP).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: pl-web-ingress, namespace: planetarium}
spec:
  podSelector: {matchLabels: {app: pl-web}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: 8080}]
    - from: [{podSelector: {matchLabels: {app: emberline-tunnel}}}]
      ports: [{protocol: TCP, port: 8090}]
---
apiVersion: v1
kind: Service
metadata: {name: pl-app, namespace: planetarium}
spec: {selector: {app: pl-app}, ports: [{name: http, port: 8080, targetPort: 8080}, {name: mgmt, port: 8081, targetPort: 8081}]}
