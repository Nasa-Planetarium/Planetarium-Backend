# Worker emberline-api: the only way from Cloudflare to the EMBERLINE origin. No workers.dev URL and no routes — it is
# reached only through the Pages Function's service binding (binding API in project emberline). Deployed by the owner
# (deploy/PUBLIC.md step 4). No token, account ID or secret lives in this file.
name = "emberline-api"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

# Workers VPC Service → Cloudflare Tunnel emberline → pl-web-tunnel.planetarium.svc.cluster.local:8090
[[vpc_services]]
binding = "ORIGIN"
service_id = "<VPC_SERVICE_ID>"  # placeholder: the owner pastes the id printed in deploy/PUBLIC.md step 3

[vars]
# Host and port the VPC Service targets (in-cluster DNS name of the tunnel listener; not a secret).
ORIGIN_BASE = "http://pl-web-tunnel.planetarium.svc.cluster.local:8090"

[observability]
enabled = true
